<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss"></style>
    <title>Document</title>
  </head>
  <body>
    <div class="bg-white max-h-[4.4rem] px-6 rounded-t-xl text-white">
      <ul class="flex relative">
        <span
          class="bg-amber-500 duration-500 border-4 border-gray-900 h-16 w-16 absolute -top-5 rounded-full"
        >
          <span
            class="w-3.5 h-3.5 bg-transparent absolute top-4 -left-[18px] rounded-tr-[11px] shadow-myShadow1"
          ></span>
          <span
            class="w-3.5 h-3.5 bg-transparent absolute top-4 -right-[18px] rounded-tl-[11px] shadow-myShadow2"
          ></span>
        </span>

        <li key="{i}" class="w-16">
          <a class="flex flex-col text-center pt-6">
            <span class="text-xl cursor-pointer duration-500">
              <IonIcon name="{menu.icon}" />
            </span>
            <span class="translate-y-4 duration-700 opacity-100">
              {menu.name}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
